name: Update Offerings Manifest

on:
  workflow_dispatch:
  release:
    types:
      - published
      - edited
      - prereleased

permissions:
  contents: write

jobs:
  update-offerings:
    runs-on: ubuntu-latest
    env:
      TARGET_REF: ${{ github.event.release.target_commitish || github.event.repository.default_branch || github.ref_name }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish || github.event.repository.default_branch || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate update offerings manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path


          REPOSITORY = os.environ['REPOSITORY']
          GITHUB_TOKEN = os.environ.get('GITHUB_TOKEN', '')
          ROOT = Path.cwd()
          PLUGIN_FILE = ROOT / 'p2026.php'
          OUTPUT_FILE = ROOT / '.github' / 'update-offerings.json'


          def parse_plugin_headers(plugin_file: Path) -> dict:
              content = plugin_file.read_text(encoding='utf-8')
              match = re.search(r'/\*\*(.*?)\*/', content, re.S)
              if not match:
                  raise RuntimeError('Unable to locate plugin header block in p2026.php')

              headers = {}
              for raw_line in match.group(1).splitlines():
                  line = raw_line.strip()
                  if not line.startswith('*'):
                      continue
                  line = line.lstrip('*').strip()
                  if ':' not in line:
                      continue
                  key, value = line.split(':', 1)
                  headers[key.strip()] = value.strip()

              return headers


          def github_request(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {GITHUB_TOKEN}',
                      'User-Agent': 'p2026-update-offerings-workflow',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)


          def normalize_version(tag_name: str) -> str:
              return re.sub(r'^[Vv]', '', tag_name or '')


          def package_url_for_release(release: dict) -> str:
              zip_assets = [
                  asset for asset in release.get('assets', [])
                  if asset.get('name', '').endswith('.zip')
              ]
              if zip_assets:
                  return zip_assets[0]['browser_download_url']

              return f"https://github.com/{REPOSITORY}/archive/refs/tags/{release['tag_name']}.zip"


          def release_entry(release: dict) -> dict:
              package_url = package_url_for_release(release)
              version = normalize_version(release.get('tag_name', ''))
              return {
                  'tag': release.get('tag_name'),
                  'version': version,
                  'name': release.get('name') or version,
                  'draft': bool(release.get('draft')),
                  'prerelease': bool(release.get('prerelease')),
                  'published_at': release.get('published_at'),
                  'created_at': release.get('created_at'),
                  'release_url': release.get('html_url'),
                  'package': package_url,
                  'zipball_url': release.get('zipball_url'),
                  'tarball_url': release.get('tarball_url'),
                  'body': release.get('body') or '',
                  'assets': [
                      {
                          'name': asset.get('name'),
                          'size': asset.get('size'),
                          'content_type': asset.get('content_type'),
                          'download_url': asset.get('browser_download_url'),
                          'download_count': asset.get('download_count'),
                      }
                      for asset in release.get('assets', [])
                  ],
              }


          plugin_headers = parse_plugin_headers(PLUGIN_FILE)
          releases = github_request(f'https://api.github.com/repos/{REPOSITORY}/releases?per_page=100')
          offerings = [release_entry(release) for release in releases]

          latest = next(
              (release for release in offerings if not release['draft'] and not release['prerelease']),
              None,
          )

          if latest is None:
              latest = next((release for release in offerings if not release['draft']), None)

          manifest = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'repository': {
                  'full_name': REPOSITORY,
                  'url': f'https://github.com/{REPOSITORY}',
                  'default_branch': os.environ.get('TARGET_REF'),
              },
              'plugin': {
                  'name': plugin_headers.get('Plugin Name'),
                  'slug': Path(REPOSITORY).name,
                  'file': PLUGIN_FILE.name,
                  'version': plugin_headers.get('Version'),
                  'plugin_uri': plugin_headers.get('Plugin URI'),
                  'update_uri': plugin_headers.get('Update URI'),
                  'requires': plugin_headers.get('Requires at least'),
                  'requires_php': plugin_headers.get('Requires PHP'),
                  'tested': plugin_headers.get('Tested up to'),
                  'sections': {
                      'description': plugin_headers.get('Description'),
                  },
              },
              'latest': None,
              'offerings': offerings,
          }

          if latest is not None:
              manifest['latest'] = {
                  **latest,
                  'wordpress_update': {
                      'new_version': latest['version'],
                      'package': latest['package'],
                      'url': latest['release_url'],
                      'requires': manifest['plugin']['requires'],
                      'requires_php': manifest['plugin']['requires_php'],
                      'tested': manifest['plugin']['tested'],
                  },
              }

          OUTPUT_FILE.write_text(json.dumps(manifest, indent='\t') + '\n', encoding='utf-8')
          PY

      - name: Commit updated offerings manifest
        run: |
          if git diff --quiet -- .github/update-offerings.json; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/update-offerings.json
          git commit -m "chore: update offerings manifest"
          git push origin "HEAD:${TARGET_REF}"